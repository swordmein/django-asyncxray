name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install \
            "Django>=6.1,<6.2" \
            "asgiref>=3.12,<3.13" \
            "pytest>=9,<10" \
            "pytest-asyncio>=1.4,<2" \
            "pytest-django>=4.14,<5"

      - name: Show runtime versions
        run: |
          python --version
          python - <<'PY'
          import django
          import asgiref
          import pytest

          print("Django:", django.get_version())
          print("asgiref:", asgiref.__version__)
          print("pytest:", pytest.__version__)
          PY

      - name: Run compatibility check
        run: |
          python - <<'PY'
          from asyncxray.checks import check_runtime

          report = check_runtime(strict=True)

          print("Python:", report.python_version)
          print("Django:", report.django_version)
          print("asgiref:", report.asgiref_version)
          print("supported:", report.supported)
          PY

      - name: Run test suite
        run: |
          python -m pytest -v
