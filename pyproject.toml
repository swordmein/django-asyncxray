[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-asyncxray"
version = "0.1.0"
description = "Semantic sync/async boundary diagnostics for Django"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "django>=5.2",
    "asgiref>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
]

[project.scripts]
asyncxray = "asyncxray.cli:main"

[project.entry-points.pytest11]
asyncxray = "asyncxray.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["asyncxray"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "testproject.settings"
pythonpath = [".", "testproject"]
